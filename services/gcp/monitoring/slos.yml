name: Cloud Monitoring Service Level Objectives
description: >-
  A target level of reliability for a service, measured against an
  indicator over a rolling or calendar window.
scope: LOW
privileges:
  create:
    risks: []
  delete:
    risks: [destruction:defense]
  get:
    risks: [discovery:infra]
  list:
    risks: [discovery:infra]
  update:
    risks: [destruction:defense]
links:
  - https://cloud.google.com/monitoring/access-control
  - https://cloud.google.com/monitoring/api/ref_v3/rest/v3/services.serviceLevelObjectives
